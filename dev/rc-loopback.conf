# WordPress calls itself at its public address, http://localhost:8090 (WP-Cron's spawn, Site
# Health loopback tests). Inside the container only port 80 is served, so these requests failed
# and scheduled events never ran. Serve the site on 8090 inside the container as well.
Listen 8090
<VirtualHost *:8090>
	DocumentRoot /var/www/html
</VirtualHost>
